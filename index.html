<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SapSap Online</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: radial-gradient(circle at top, #0f172a, #000);
    color: white;
    font-family: sans-serif;
}

.fade-in {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(10px);}
    to {opacity:1; transform: translateY(0);}
}

.glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
}

.btn {
    transition: all 0.2s ease;
}

.btn:active {
    transform: scale(0.92);
}

.btn:hover {
    transform: scale(1.05);
}

.card {
    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-4px) scale(1.01);
}

.glow {
    box-shadow: 0 0 15px rgba(59,130,246,0.5);
}

.loader {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #3b82f6;
    border-radius: 50%;
    animation: blink 0.6s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}
</style>
</head>

<body>

<div id="app" class="min-h-screen max-w-md mx-auto flex flex-col"></div>

<script>
const API_URL = 'http://localhost:3000/api';

let state = {
    role: null,
    isLoggedIn: false,
    login: '',
    address: '',
    multiplier: 1,
    cart: [],
    orders: [],
    loading: false
};

async function syncOrders() {
    try {
        const res = await fetch(`${API_URL}/orders`);
        if (res.ok) {
            state.orders = await res.json();
            render();
        }
    } catch (err) {
        console.error('Ошибка синхронизации:', err);
    }
}

async function sendOrder() {
    if (!state.cart.length) return;
    
    state.loading = true;
    render();

    try {
        const newOrder = {
            client: state.login,
            address: state.address,
            items: state.cart,
            status: 'pending'
        };

        const res = await fetch(`${API_URL}/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newOrder)
        });

        if (res.ok) {
            state.cart = [];
            await syncOrders();
        }
    } catch (err) {
        console.error('Ошибка отправки заказа:', err);
        alert('Ошибка при отправке заказа');
    } finally {
        state.loading = false;
    }
}

async function acceptOrder(id) {
    state.loading = true;
    render();

    try {
        const res = await fetch(`${API_URL}/orders/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'accepted' })
        });

        if (res.ok) {
            await syncOrders();
        }
    } catch (err) {
        console.error('Ошибка принятия заказа:', err);
        alert('Ошибка при принятии заказа');
    } finally {
        state.loading = false;
    }
}

function render() {
    const app = document.getElementById('app');

    if (!state.role) {
        app.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center p-6 fade-in">
            <h1 class="text-6xl font-black italic text-blue-500 glow mb-12">SapSap</h1>
            <div class="w-full space-y-4">
                <button onclick="setRole('client')" class="btn w-full glass p-6 rounded-2xl font-bold text-xl">🍔 Я Клиент</button>
                <button onclick="setRole('courier')" class="btn w-full glass p-6 rounded-2xl font-bold text-xl">🚗 Я Курьер</button>
            </div>
        </div>`;
        return;
    }

    if (!state.isLoggedIn) {
        app.innerHTML = `
        <div class="flex-1 flex flex-col justify-center p-6 fade-in">
            <h2 class="text-2xl font-bold mb-6">Вход</h2>
            <input id="in-login" class="glass p-4 rounded-xl mb-3 w-full" placeholder="Логин">
            ${state.role === 'client'
                ? `<input id="in-addr" class="glass p-4 rounded-xl mb-3 w-full" placeholder="Адрес">
`                : `<input id="in-age" type="number" class="glass p-4 rounded-xl mb-3 w-full" placeholder="Возраст">
`            }
            <button onclick="login()" class="btn bg-blue-600 p-4 rounded-xl font-bold glow">Войти</button>
        </div>`;
        return;
    }

    if (state.role === 'client') {
        const myOrders = state.orders.filter(o => o.client === state.login);

        app.innerHTML = `
        <header class="p-4 flex justify-between glass">
            <span class="text-blue-400 font-bold">SapSap</span>
            <span class="text-xs opacity-70">${state.login}</span>
        </header>

        <div class="flex-1 p-4 space-y-4 overflow-y-auto fade-in">

            ${state.cart.length ? `
            <div class="glass p-4 rounded-xl card">
                <p class="text-sm mb-2">🛒 Твой список:</p>
                ${state.cart.map(i => `<div>${i.text} x${i.qty}</div>`).join('')}
                <button onclick="sendOrder()" class="btn mt-3 bg-blue-600 px-4 py-2 rounded-lg w-full ${state.loading ? 'opacity-50' : ''}">
                    ${state.loading ? '<span class="loader"></span> Отправляю...' : 'Отправить'}
                </button>
            </div>` : ''}

            ${myOrders.length === 0 && !state.cart.length ? '<p class="text-center opacity-50 mt-8">Пока нет заказов</p>' : ''}

            ${myOrders.map(o => `
            <div class="glass p-4 rounded-xl card">
                <div class="flex justify-between text-xs mb-2">
                    <span>#${o.id.slice(0,4)}</span>
                    <span class="${o.status === 'accepted' ? 'text-green-400' : 'text-orange-400'}">
                        ${o.status === 'accepted' ? 'В пути 🚗' : 'Поиск...'}
                    </span>
                </div>
                ${o.items.map(i => `<div>${i.text} x${i.qty}</div>`).join('')}
            </div>`).join('')}

        </div>

        <div class="p-4 flex gap-2 glass">
            <button onclick="incMult()" class="btn bg-zinc-800 px-4 rounded-lg">
                x${state.multiplier}
            </button>
            <input id="msg-input" class="flex-1 glass px-4 rounded-lg" placeholder="Что купить?">
            <button onclick="addToList()" class="btn bg-blue-600 px-4 rounded-lg">+</button>
        </div>`;
    } else {
        const available = state.orders.filter(o => o.status === 'pending');

        app.innerHTML = `
        <header class="p-4 flex justify-between glass">
            <span class="text-green-400 font-bold">SapSap Drive</span>
            <span class="text-xs opacity-70">${state.login}</span>
        </header>

        <div class="p-4 space-y-4 fade-in overflow-y-auto flex-1">
            ${available.length === 0 ? '<p class="text-center opacity-50">Нет заказов</p>' : ''}

            ${available.map(o => `
            <div class="glass p-4 rounded-xl card">
                <p class="font-bold">${o.client}</p>
                <p class="text-sm opacity-70">${o.address}</p>
                <div class="my-2">
                    ${o.items.map(i => `<div>${i.text} x${i.qty}</div>`).join('')}
                </div>
                <button onclick="acceptOrder('${o.id}')" class="btn bg-white text-black px-4 py-2 rounded-lg w-full ${state.loading ? 'opacity-50' : ''}">
                    ${state.loading ? 'Обработка...' : 'Принять'}
                </button>
            </div>`).join('')}
        </div>`;
    }
}

function setRole(r) {
    state.role = r;
    render();
}

function login() {
    state.login = document.getElementById('in-login').value;
    if (state.role === 'client') {
        state.address = document.getElementById('in-addr').value;
    }
    if (state.login) {
        state.isLoggedIn = true;
        syncOrders();
    }
}

function incMult() {
    state.multiplier++;
    render();
}

function addToList() {
    const input = document.getElementById('msg-input');
    if (!input.value) return;
    state.cart.push({ text: input.value, qty: state.multiplier });
    state.multiplier = 1;
    input.value = '';
    render();
}

// Синхронизация каждые 2 секунды
setInterval(syncOrders, 2000);

syncOrders();
render();
</script>

</body>
</html>
