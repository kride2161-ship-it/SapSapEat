<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SapSap - Закажи Соседу</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: radial-gradient(circle at top, #0f172a, #000);
    color: white;
    font-family: sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

.fade-in {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(10px);}
    to {opacity:1; transform: translateY(0);}
}

.glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
}

.btn {
    transition: all 0.15s ease;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    z-index: 1;
}

.btn:active {
    transform: scale(0.95);
    opacity: 0.8;
}

.card {
    transition: all 0.25s ease;
}

.glow {
    box-shadow: 0 0 15px rgba(59,130,246,0.5);
}

.pulse {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}
</style>
</head>

<body>

<div id="app" class="min-h-screen max-w-md mx-auto flex flex-col"></div>

<script>
let state = {
    role: null,
    isLoggedIn: false,
    login: '',
    address: '',
    multiplier: 1,
    cart: [],
    orders: [],
    selectedCourier: null
};

function generateShareLink() {
    const data = {
        orders: state.orders,
        timestamp: Date.now()
    };
    const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
    return window.location.origin + window.location.pathname + '#data=' + encoded;
}

function loadFromHash() {
    const hash = window.location.hash;
    if (hash.includes('#data=')) {
        try {
            const encoded = hash.split('#data=')[1];
            const data = JSON.parse(decodeURIComponent(atob(encoded)));
            if (data.orders) {
                mergeOrders(data.orders);
            }
        } catch (e) {
            console.log('Не удалось загрузить данные');
        }
    }
}

function mergeOrders(newOrders) {
    newOrders.forEach(newOrder => {
        const exists = state.orders.find(o => o.id === newOrder.id);
        if (!exists) {
            state.orders.push(newOrder);
        } else if (newOrder.status === 'accepted' || newOrder.status === 'completed') {
            Object.assign(exists, newOrder);
        }
    });
    saveToStorage();
    render();
}

function saveToStorage() {
    localStorage.setItem('sapsap_orders', JSON.stringify(state.orders));
}

function loadFromStorage() {
    const saved = localStorage.getItem('sapsap_orders');
    if (saved) {
        state.orders = JSON.parse(saved);
    }
}

function updateShareLink() {
    const link = generateShareLink();
    window.location.hash = 'data=' + btoa(encodeURIComponent(JSON.stringify({
        orders: state.orders,
        timestamp: Date.now()
    })));
    return link;
}

function sendOrder() {
    if (!state.cart.length) return;
    
    const newOrder = {
        id: Date.now().toString(),
        client: state.login,
        address: state.address,
        items: [...state.cart],
        status: 'pending',
        time: new Date().toLocaleTimeString(),
        created: Date.now()
    };

    state.orders.push(newOrder);
    state.cart = [];
    saveToStorage();
    updateShareLink();
    render();
    
    showNotification('✅ Заказ создан! Отправьте ссылку курьеру');
}

function acceptOrder(id) {
    const order = state.orders.find(o => o.id === id);
    if (order) {
        order.status = 'accepted';
        order.courier = state.login;
        order.acceptedTime = new Date().toLocaleTimeString();
        saveToStorage();
        updateShareLink();
        render();
        showNotification('✅ Вы приняли заказ от ' + order.client);
    }
}

function completeOrder(id) {
    const order = state.orders.find(o => o.id === id);
    if (order) {
        order.status = 'completed';
        saveToStorage();
        updateShareLink();
        render();
        showNotification('✅ Заказ выполнен!');
    }
}

function showNotification(message) {
    const oldNotif = document.querySelector('.notification-popup');
    if (oldNotif) oldNotif.remove();
    
    const notif = document.createElement('div');
    notif.className = 'notification-popup fixed top-4 left-4 right-4 glass p-4 rounded-xl fade-in';
    notif.style.cssText = 'z-index: 1000; max-width: 400px; margin: 0 auto;';
    notif.textContent = message;
    document.body.appendChild(notif);
    setTimeout(() => {
        notif.style.opacity = '0';
        notif.style.transition = 'opacity 0.3s';
        setTimeout(() => notif.remove(), 300);
    }, 2500);
}

function render() {
    const app = document.getElementById('app');

    if (!state.role) {
        app.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center p-6 fade-in">
            <h1 class="text-6xl font-black italic text-blue-500 glow mb-4">SapSap</h1>
            <p class="text-sm opacity-50 mb-8">Закажи у соседа</p>
            <div class="w-full space-y-4">
                <button onclick="setRole('client')" class="btn w-full glass p-6 rounded-2xl font-bold text-xl" style="pointer-events: auto;">
                    🍔 Я Хочу Заказать
                </button>
                <button onclick="setRole('courier')" class="btn w-full glass p-6 rounded-2xl font-bold text-xl" style="pointer-events: auto;">
                    🚗 Я Могу Доставить
                </button>
            </div>
            <p class="text-xs opacity-30 mt-8 text-center">
                Работает без регистрации<br>Просто поделись ссылкой
            </p>
        </div>`;
        return;
    }

    if (!state.isLoggedIn) {
        app.innerHTML = `
        <div class="flex-1 flex flex-col justify-center p-6 fade-in">
            <h2 class="text-2xl font-bold mb-2">${state.role === 'client' ? '🍔 Заказчик' : '🚗 Курьер'}</h2>
            <p class="text-sm opacity-50 mb-6">Представьтесь, пожалуйста</p>
            <input id="in-login" class="glass p-4 rounded-xl mb-3 w-full" placeholder="Ваше имя" autocomplete="off">
            ${state.role === 'client' 
                ? `<input id="in-addr" class="glass p-4 rounded-xl mb-3 w-full" placeholder="Куда доставить?" autocomplete="off">`
                : ''
            }
            <button onclick="login()" class="btn bg-blue-600 p-4 rounded-xl font-bold glow" style="pointer-events: auto;">
                Начать
            </button>
            <button onclick="state.role=null;render()" class="btn w-full glass p-3 rounded-xl mt-2 text-sm" style="pointer-events: auto;">
                ← Назад
            </button>
        </div>`;
        return;
    }

    if (state.role === 'client') {
        const myOrders = state.orders.filter(o => o.client === state.login);
        const shareLink = updateShareLink();

        app.innerHTML = `
        <header class="p-4 glass">
            <div class="flex justify-between items-center">
                <span class="text-blue-400 font-bold">🍔 Заказчик</span>
                <span class="text-sm opacity-70">${state.login}</span>
                <button onclick="state.isLoggedIn=false;state.cart=[];render()" class="text-xs opacity-50 hover:opacity-100" style="pointer-events: auto;">
                    Выйти
                </button>
            </div>
            <div class="mt-2 text-xs opacity-50 truncate">📍 ${state.address}</div>
        </header>

        <div class="flex-1 p-4 space-y-4 overflow-y-auto fade-in" style="overflow-y: auto; -webkit-overflow-scrolling: touch;">

            ${state.cart.length ? `
            <div class="glass p-4 rounded-xl">
                <p class="text-sm mb-2 font-bold">🛒 Корзина:</p>
                ${state.cart.map(i => `<div class="text-sm ml-2">• ${i.text} ×${i.qty}</div>`).join('')}
                <button onclick="sendOrder()" class="btn mt-3 bg-blue-600 px-4 py-2 rounded-lg w-full font-bold" style="pointer-events: auto;">
                    📦 Отправить заказ
                </button>
                <button onclick="state.cart=[];render()" class="btn w-full glass p-2 rounded-lg mt-2 text-sm" style="pointer-events: auto;">
                    ✕ Очистить корзину
                </button>
            </div>` : ''}

            <h3 class="font-bold">📋 Мои заказы:</h3>
            ${myOrders.length === 0 ? '<p class="text-center opacity-50 mt-4">Нет заказов</p>' : ''}
            
            ${[...myOrders].reverse().map(o => `
            <div class="glass p-4 rounded-xl">
                <div class="flex justify-between text-xs mb-2">
                    <span>🕐 ${o.time}</span>
                    <span class="${o.status === 'accepted' ? 'text-green-400' : o.status === 'completed' ? 'text-blue-400' : 'text-orange-400'}">
                        ${o.status === 'accepted' ? '🚗 ' + o.courier + ' везёт' : o.status === 'completed' ? '✅ Доставлено' : '⏳ Ищем курьера'}
                    </span>
                </div>
                ${o.items.map(i => `<div class="text-sm">• ${i.text} ×${i.qty}</div>`).join('')}
            </div>`).join('')}

            <div class="glass p-4 rounded-xl mt-4">
                <p class="text-xs opacity-70 mb-2">📤 Поделитесь ссылкой с курьером:</p>
                <div class="flex gap-2">
                    <input id="share-link" class="flex-1 glass p-2 rounded-lg text-xs text-white" value="${shareLink}" readonly>
                    <button onclick="copyShareLink()" class="btn bg-blue-600 px-3 rounded-lg text-xs font-bold" style="pointer-events: auto;">
                        Копировать
                    </button>
                </div>
            </div>

        </div>

        <div class="p-4 flex gap-2 glass">
            <button onclick="changeMultiplier()" class="btn bg-zinc-800 px-4 rounded-lg min-w-[60px] font-bold" style="pointer-events: auto;">
                ×${state.multiplier}
            </button>
            <input id="msg-input" class="flex-1 glass px-4 rounded-lg text-white" placeholder="Что заказать?" autocomplete="off">
            <button onclick="addToCart()" class="btn bg-blue-600 px-6 rounded-lg font-bold text-xl" style="pointer-events: auto;">
                +
            </button>
        </div>`;
    } else {
        const available = state.orders.filter(o => o.status === 'pending');
        const myOrders = state.orders.filter(o => o.courier === state.login && (o.status === 'accepted' || o.status === 'completed'));
        const shareLink = updateShareLink();

        app.innerHTML = `
        <header class="p-4 glass">
            <div class="flex justify-between items-center">
                <span class="text-green-400 font-bold">🚗 Курьер</span>
                <span class="text-sm opacity-70">${state.login}</span>
                <button onclick="state.isLoggedIn=false;render()" class="text-xs opacity-50 hover:opacity-100" style="pointer-events: auto;">
                    Выйти
                </button>
            </div>
        </header>

        <div class="p-4 space-y-4 fade-in overflow-y-auto flex-1" style="overflow-y: auto; -webkit-overflow-scrolling: touch;">
            
            ${myOrders.length > 0 ? `
            <div>
                <h3 class="font-bold text-green-400 mb-2">✅ Мои доставки:</h3>
                ${myOrders.map(o => `
                <div class="glass p-4 rounded-xl mb-2">
                    <div class="flex justify-between text-xs">
                        <span class="font-bold">👤 ${o.client}</span>
                        <span>🕐 ${o.acceptedTime}</span>
                    </div>
                    <p class="text-sm opacity-70">📍 ${o.address}</p>
                    <div class="my-2">
                        ${o.items.map(i => `<div class="text-sm">• ${i.text} ×${i.qty}</div>`).join('')}
                    </div>
                    ${o.status === 'accepted' ? `
                    <button onclick="completeOrder('${o.id}')" class="btn bg-green-600 px-4 py-2 rounded-lg w-full text-sm font-bold mt-2" style="pointer-events: auto;">
                        ✅ Доставил
                    </button>` : `
                    <div class="text-xs text-blue-400 mt-2">Выполнен</div>`}
                </div>`).join('')}
            </div>
            ` : ''}

            <h3 class="font-bold text-orange-400">🆕 Доступные заказы (${available.length}):</h3>
            ${available.length === 0 ? '<p class="text-center opacity-50 mt-4">Нет заказов. Ждём...</p>' : ''}

            ${available.map(o => `
            <div class="glass p-4 rounded-xl">
                <p class="font-bold">👤 ${o.client}</p>
                <p class="text-sm opacity-70">📍 ${o.address}</p>
                <p class="text-xs opacity-50">🕐 ${o.time}</p>
                <div class="my-2">
                    ${o.items.map(i => `<div class="text-sm">• ${i.text} ×${i.qty}</div>`).join('')}
                </div>
                <button onclick="acceptOrder('${o.id}')" class="btn bg-white text-black px-4 py-2 rounded-lg w-full font-bold" style="pointer-events: auto;">
                    🤝 Взять заказ
                </button>
            </div>`).join('')}

            <div class="glass p-4 rounded-xl mt-4">
                <p class="text-xs opacity-70 mb-2">🔄 Загрузить заказы от клиента:</p>
                <div class="flex gap-2">
                    <input id="import-link" class="flex-1 glass p-2 rounded-lg text-xs text-white" placeholder="Вставьте ссылку" autocomplete="off">
                    <button onclick="importFromLink()" class="btn bg-green-600 px-3 rounded-lg text-xs font-bold" style="pointer-events: auto;">
                        Загрузить
                    </button>
                </div>
                <p class="text-xs opacity-40 mt-2">Или просто откройте ссылку клиента в браузере</p>
            </div>

        </div>`;
    }
}

function login() {
    const loginInput = document.getElementById('in-login');
    if (!loginInput) return;
    
    state.login = loginInput.value.trim();
    
    if (!state.login) {
        alert('Введите имя!');
        return;
    }
    
    if (state.role === 'client') {
        const addrInput = document.getElementById('in-addr');
        if (!addrInput) return;
        
        state.address = addrInput.value.trim();
        if (!state.address) {
            alert('Введите адрес доставки!');
            return;
        }
    }
    
    state.isLoggedIn = true;
    render();
}

function changeMultiplier() {
    state.multiplier = state.multiplier >= 10 ? 1 : state.multiplier + 1;
    render();
}

function addToCart() {
    const input = document.getElementById('msg-input');
    if (!input || !input.value.trim()) return;
    
    state.cart.push({ 
        text: input.value.trim(), 
        qty: state.multiplier 
    });
    state.multiplier = 1;
    input.value = '';
    render();
}

function copyShareLink() {
    const linkInput = document.getElementById('share-link');
    if (!linkInput) return;
    
    linkInput.select();
    document.execCommand('copy');
    showNotification('📋 Ссылка скопирована! Отправьте её курьеру');
}

function importFromLink() {
    const linkInput = document.getElementById('import-link');
    if (!linkInput) return;
    
    const link = linkInput.value.trim();
    
    if (!link) {
        alert('Вставьте ссылку от клиента!');
        return;
    }
    
    if (link.includes('#data=')) {
        window.location.hash = link.split('#data=')[1];
        loadFromHash();
        showNotification('✅ Заказы загружены!');
    } else {
        alert('Неверная ссылка!');
    }
}

function setRole(role) {
    state.role = role;
    render();
}

// Добавляем обработчики для Enter на инпутах
document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        const loginInput = document.getElementById('in-login');
        const msgInput = document.getElementById('msg-input');
        const importInput = document.getElementById('import-link');
        
        if (loginInput && document.activeElement === loginInput) {
            e.preventDefault();
            login();
        } else if (msgInput && document.activeElement === msgInput) {
            e.preventDefault();
            addToCart();
        } else if (importInput && document.activeElement === importInput) {
            e.preventDefault();
            importFromLink();
        }
    }
});

// Инициализация
loadFromStorage();
loadFromHash();
render();

// Автообновление
setInterval(() => {
    const saved = localStorage.getItem('sapsap_orders');
    if (saved) {
        const parsed = JSON.parse(saved);
        if (JSON.stringify(parsed) !== JSON.stringify(state.orders)) {
            state.orders = parsed;
            render();
        }
    }
}, 3000);

// Автоматическая загрузка при вставке ссылки
document.addEventListener('paste', (e) => {
    const pastedText = e.clipboardData.getData('text');
    if (pastedText && pastedText.includes('#data=')) {
        const importInput = document.getElementById('import-link');
        if (importInput && document.activeElement !== importInput) {
            e.preventDefault();
            window.location.hash = pastedText.split('#data=')[1];
            loadFromHash();
            showNotification('✅ Данные загружены автоматически!');
        }
    }
});
</script>

</body>
</html>
